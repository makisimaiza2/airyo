<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運営管理ポータル | 学祭運営</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { margin-top: 0; color: #333; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }
    input, select, button { padding: 8px; margin-top: 5px; }
    .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
    .status-審査中 { background: #fff3cd; color: #856404; }
    .status-承認 { background: #d4edda; color: #155724; }
    .status-差戻し { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" style="background:#343a40; color:white;">
      <h2 style="color:white; margin:0;">⚙️ 運営本部 管理ポータル</h2>
    </div>

    <!-- タブ切り替えボタン -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('directory')">👥 統合名簿・団体一覧</button>
      <button class="tab-btn" onclick="switchTab('forms')">📝 申請フォーム作成</button>
      <button class="tab-btn" onclick="switchTab('submissions')">✅ 提出物・資格審査</button>
    </div>

    <!-- タブ1: 統合名簿一覧 -->
    <div id="tab-directory" class="tab-content active card">
      <h3>全団体・全個人 統合名簿</h3>
      <input type="text" id="search-input" placeholder="団体名・氏名でリアルタイム検索..." oninput="filterDirectory()">
      
      <h4>■ 団体一覧</h4>
      <table>
        <thead>
          <tr><th>団体ID</th><th>団体名</th><th>区分</th><th>代表者氏名</th><th>連絡先</th></tr>
        </thead>
        <tbody id="org-table-body"><tr><td colspan="5">読み込み中...</td></tr></tbody>
      </table>

      <h4>■ 個人・メンバー一覧</h4>
      <table>
        <thead>
          <tr><th>ユーザーID</th><th>所属団体ID</th><th>氏名</th><th>メール</th><th>役割</th></tr>
        </thead>
        <tbody id="user-table-body"><tr><td colspan="5">読み込み中...</td></tr></tbody>
      </table>
    </div>

    <!-- タブ2: 申請フォーム動的作成 -->
    <div id="tab-forms" class="tab-content card">
      <h3>新規申請フォームの全体配信</h3>
      <form id="create-form">
        <label>フォームタイトル (例: 調理責任者受講証の提出)</label><br>
        <input type="text" id="form-title" style="width:100%" required><br><br>

        <label>対象区分</label><br>
        <select id="form-target">
          <option value="個人">個人単位（各メンバー）</option>
          <option value="団体">団体単位（代表者のみ）</option>
        </select><br><br>

        <label>提出締切日</label><br>
        <input type="date" id="form-deadline" required><br><br>

        <button type="submit" style="background:#28a745; color:white; border:none; cursor:pointer;">申請フォームを配信公開する</button>
      </form>
    </div>

    <!-- タブ3: 提出物・資格審査 -->
    <div id="tab-submissions" class="tab-content card">
      <h3>提出物・各種資格 審査ステータス</h3>
      <table>
        <thead>
          <tr>
            <th>提出ID</th><th>対象者ID/名前</th><th>添付/データ</th><th>提出日時</th><th>ステータス</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="sub-table-body"><tr><td colspan="6">読み込み中...</td></tr></tbody>
      </table>
    </div>

  </div>

  <script>
    // ★ご自身のGASデプロイURLに書き換えてください★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx7gn6UibMj5JzjjfNcr3FcQpyAv2V0fX4FXNbv3pb9r1L5C5e7n1fTcAn5GNHg8PZu/exec";

    let directoryData = { organizations: [], users: [] };

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if (tabName === 'directory') loadDirectory();
      if (tabName === 'submissions') loadSubmissions();
    }

    // 名簿データ読み込み
    async function loadDirectory() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getAllDirectory`);
        const data = await res.json();
        if (data.status === 'success') {
          directoryData = data;
          renderDirectory(data.organizations, data.users);
        }
      } catch (e) { alert('名簿取得エラー: ' + e); }
    }

    function renderDirectory(orgs, users) {
      const orgBody = document.getElementById('org-table-body');
      orgBody.innerHTML = orgs.map(o => `
        <tr><td>${o.org_id}</td><td><b>${o.org_name}</b></td><td>${o.category}</td><td>${o.rep_name}</td><td>${o.rep_email} / ${o.rep_phone}</td></tr>
      `).join('');

      const userBody = document.getElementById('user-table-body');
      userBody.innerHTML = users.map(u => `
        <tr><td>${u.user_id}</td><td>${u.org_id}</td><td><b>${u.user_name}</b></td><td>${u.email}</td><td>${u.role}</td></tr>
      `).join('');
    }

    // リアルタイム検索フィルター
    function filterDirectory() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filteredOrgs = directoryData.organizations.filter(o => o.org_name.toLowerCase().includes(q) || o.rep_name.toLowerCase().includes(q));
      const filteredUsers = directoryData.users.filter(u => u.user_name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
      renderDirectory(filteredOrgs, filteredUsers);
    }

    // フォーム新規作成送信
    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        action: 'createFormTemplate',
        title: document.getElementById('form-title').value,
        target_type: document.getElementById('form-target').value,
        deadline: document.getElementById('form-deadline').value
      };

      const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === 'success') {
        alert('申請フォームを正常に配信しました！');
        document.getElementById('create-form').reset();
      }
    });

    // 提出一覧＆審査処理
    async function loadSubmissions() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getFormsAndSubmissions`);
        const data = await res.json();
        if (data.status === 'success') {
          const body = document.getElementById('sub-table-body');
          body.innerHTML = data.submissions.map(s => `
            <tr>
              <td>${s.sub_id}</td>
              <td>${s.submitter_name} (${s.target_id})</td>
              <td>${s.file_url ? `<a href="${s.file_url}" target="_blank">添付閲覧</a>` : 'データのみ'}</td>
              <td>${new Date(s.submitted_at).toLocaleString('ja-JP')}</td>
              <td><span class="status-badge status-${s.status}">${s.status}</span></td>
              <td>
                <button onclick="updateStatus('${s.sub_id}', '承認')">承認</button>
                <button onclick="updateStatus('${s.sub_id}', '差戻し')">差戻し</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) { alert('提出一覧取得エラー: ' + e); }
    }

    async function updateStatus(subId, status) {
      const payload = { action: 'updateSubmissionStatus', sub_id: subId, status: status };
      const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === 'success') {
        loadSubmissions();
      }
    }

    // 初回読み込み
    loadDirectory();
  </script>
</body>
</html>
