<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>学園祭実行委員会 統合管理システム</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-indigo-600 text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-4">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

      <a href="index.html"
         class="text-xl font-bold hover:opacity-90">
        学園祭実行委員会 統合管理システム
      </a>

      <nav class="flex flex-wrap gap-2">

        <a href="index.html"
           class="px-4 py-2 rounded-lg bg-white/20">
          🏠 メイン
        </a>

        <a href="group.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20 transition">
          🏢 団体
        </a>

        <a href="user.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20 transition">
          👤 個人
        </a>

        <a href="admin.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20 transition">
          ⚙️ 管理者
        </a>

      </nav>

    </div>
  </div>
</header>


<main class="max-w-6xl mx-auto px-4 py-12">

  <section class="text-center mb-12">

    <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
      学園祭実行委員会
      <br>
      統合管理システム
    </h1>

    <p class="text-gray-600 text-lg">
      各種申請・団体管理・個人管理を一元化します。
    </p>

  </section>


  <section class="grid md:grid-cols-2 gap-8 mb-12">

    <a href="group.html"
       class="bg-white rounded-2xl shadow-md p-8 hover:shadow-xl hover:-translate-y-1 transition">

      <div class="text-5xl mb-5">
        🏢
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-3">
        団体ページ
      </h2>

      <p class="text-gray-600 mb-6">
        団体としてログインし、団体情報の確認、
        メンバー登録、各種申請を行います。
      </p>

      <span class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg">
        団体ページへ →
      </span>

    </a>


    <a href="user.html"
       class="bg-white rounded-2xl shadow-md p-8 hover:shadow-xl hover:-translate-y-1 transition">

      <div class="text-5xl mb-5">
        👤
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-3">
        個人ページ
      </h2>

      <p class="text-gray-600 mb-6">
        発行されたユーザーIDでログインし、
        個人向けの申請を行います。
      </p>

      <span class="inline-block bg-green-600 text-white px-6 py-3 rounded-lg">
        個人ページへ →
      </span>

    </a>

  </section>


  <section class="bg-gray-800 text-white rounded-2xl p-8">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">

      <div>
        <h2 class="text-2xl font-bold mb-2">
          ⚙️ 管理者
        </h2>

        <p class="text-gray-300">
          フォーム作成・申請確認・審査・団体一覧などを管理します。
        </p>
      </div>

      <a href="admin.html"
         class="bg-white text-gray-800 font-bold px-6 py-3 rounded-lg hover:bg-gray-100">
        管理者ページへ →
      </a>

    </div>

  </section>

</main>


<footer class="bg-gray-900 text-gray-400 text-center py-6">
  学園祭実行委員会 統合管理システム
</footer>

</body>
</html>
