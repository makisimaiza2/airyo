<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>個人ページ - 学園祭実行委員会 統合管理システム</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen">


<header class="bg-indigo-600 text-white shadow-lg">

  <div class="max-w-7xl mx-auto px-4 py-4">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

      <a href="index.html"
         class="text-xl font-bold">

        学園祭実行委員会 統合管理システム

      </a>


      <nav class="flex flex-wrap gap-2">

        <a href="index.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20">

          🏠 メイン

        </a>

        <a href="group.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20">

          🏢 団体

        </a>

        <a href="user.html"
           class="px-4 py-2 rounded-lg bg-white/20">

          👤 個人

        </a>

        <a href="admin.html"
           class="px-4 py-2 rounded-lg hover:bg-white/20">

          ⚙️ 管理者

        </a>

      </nav>

    </div>

  </div>

</header>


<main class="max-w-5xl mx-auto px-4 py-8">


  <!-- 認証 -->

  <div id="authArea"
       class="bg-white rounded-2xl shadow p-6">

    <div class="flex flex-wrap gap-2 mb-6">

      <button
        onclick="showAuth('login')"
        id="loginTab"
        class="bg-indigo-600 text-white px-5 py-2 rounded-lg">

        個人ログイン

      </button>

      <button
        onclick="showAuth('recover')"
        id="recoverTab"
        class="bg-gray-200 px-5 py-2 rounded-lg">

        ID回復

      </button>

    </div>


    <!-- ログイン -->

    <div id="loginBox">

      <h1 class="text-2xl font-bold mb-5">
        👤 個人ログイン
      </h1>


      <form
        onsubmit="loginUser(event)"
        class="space-y-4">

        <input
          id="userId"
          required
          placeholder="ユーザーID"
          class="w-full border rounded-lg px-4 py-3">


        <input
          id="userPassword"
          type="password"
          required
          placeholder="パスワード"
          class="w-full border rounded-lg px-4 py-3">


        <button
          class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">

          ログイン

        </button>

      </form>

    </div>


    <!-- ID回復 -->

    <div id="recoverBox"
         class="hidden">

      <h1 class="text-2xl font-bold mb-5">
        🔎 ユーザーID回復
      </h1>


      <form
        onsubmit="recoverUser(event)"
        class="space-y-4">

        <input
          id="recoverUserName"
          required
          placeholder="氏名"
          class="w-full border rounded-lg px-4 py-3">


        <input
          id="recoverUserEmail"
          type="email"
          required
          placeholder="メールアドレス"
          class="w-full border rounded-lg px-4 py-3">


        <button
          class="w-full bg-gray-700 text-white py-3 rounded-lg font-bold">

          ユーザーIDを確認

        </button>

      </form>

    </div>

  </div>


  <!-- ダッシュボード -->

  <div id="dashboard"
       class="hidden">


    <section class="bg-white rounded-2xl shadow p-6 mb-6">

      <div class="flex flex-col md:flex-row md:justify-between gap-4">

        <div>

          <p class="text-gray-500">
            ログイン中
          </p>

          <h1 id="userNameDisplay"
              class="text-3xl font-bold">
          </h1>

          <p id="userIdDisplay"
             class="text-gray-500">
          </p>

        </div>


        <button
          onclick="logout()"
          class="bg-red-500 text-white px-5 py-3 rounded-lg">

          ログアウト

        </button>

      </div>

    </section>


    <section class="bg-white rounded-2xl shadow p-6 mb-6">

      <h2 class="text-2xl font-bold mb-5">
        📋 個人向け申請
      </h2>

      <div id="formsArea">
      </div>

    </section>


    <section class="bg-white rounded-2xl shadow p-6">

      <h2 class="text-2xl font-bold mb-5">
        📂 提出履歴
      </h2>

      <div id="historyArea">
      </div>

    </section>


  </div>

</main>


<footer class="bg-gray-900 text-gray-400 text-center py-6 mt-12">

  学園祭実行委員会 統合管理システム

</footer>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbx7gn6UibMj5JzjjfNcr3FcQpyAv2V0fX4FXNbv3pb9r1L5C5e7n1fTcAn5GNHg8PZu/execL';


let user = null;
let forms = [];
let submissions = [];


/* =========================================
   API
========================================= */

async function api(data) {

  const response = await fetch(API_URL, {

    method: 'POST',

    body: JSON.stringify(data)

  });

  return await response.json();
}


/* =========================================
   認証切替
========================================= */

function showAuth(type) {

  document
    .getElementById('loginBox')
    .classList.add('hidden');

  document
    .getElementById('recoverBox')
    .classList.add('hidden');


  document
    .getElementById('loginTab')
    .className =
      'bg-gray-200 px-5 py-2 rounded-lg';

  document
    .getElementById('recoverTab')
    .className =
      'bg-gray-200 px-5 py-2 rounded-lg';


  if (type === 'login') {

    document
      .getElementById('loginBox')
      .classList.remove('hidden');

    document
      .getElementById('loginTab')
      .className =
        'bg-indigo-600 text-white px-5 py-2 rounded-lg';

  } else {

    document
      .getElementById('recoverBox')
      .classList.remove('hidden');

    document
      .getElementById('recoverTab')
      .className =
        'bg-indigo-600 text-white px-5 py-2 rounded-lg';

  }

}


/* =========================================
   ログイン
========================================= */

async function loginUser(event) {

  event.preventDefault();


  const result = await api({

    action: 'loginUser',

    user_id:
      document.getElementById('userId').value,

    password:
      document.getElementById('userPassword').value

  });


  if (!result.success) {

    alert(result.message);
    return;

  }


  user = result.user;


  sessionStorage.setItem(
    'festivalUser',
    JSON.stringify(user)
  );


  showDashboard();

  await loadForms();

  await loadSubmissions();

}


/* =========================================
   ID回復
========================================= */

async function recoverUser(event) {

  event.preventDefault();


  const result = await api({

    action: 'recoverUserId',

    user_name:
      document.getElementById('recoverUserName').value,

    email:
      document.getElementById('recoverUserEmail').value

  });


  if (!result.success) {

    alert(result.message);
    return;

  }


  const ids =
    result.users
      .map(user => user.user_id)
      .join('\n');


  alert(
    '該当するユーザーID：\n\n' +
    ids
  );

}


/* =========================================
   ダッシュボード
========================================= */

function showDashboard() {

  document
    .getElementById('authArea')
    .classList.add('hidden');


  document
    .getElementById('dashboard')
    .classList.remove('hidden');


  document
    .getElementById('userNameDisplay')
    .textContent =
      user.user_name;


  document
    .getElementById('userIdDisplay')
    .textContent =
      'ユーザーID：' +
      user.user_id;

}


/* =========================================
   フォーム取得
========================================= */

async function loadForms() {

  const result = await api({

    action: 'getFormsForTarget',

    target_type: 'individual'

  });


  if (!result.success) {

    alert(result.message);
    return;

  }


  forms = result.forms;

  renderForms();

}


/* =========================================
   フォーム表示
========================================= */

function renderForms() {

  const area =
    document.getElementById('formsArea');

  area.innerHTML = '';


  if (forms.length === 0) {

    area.innerHTML = `
      <p class="text-gray-500">
        現在、個人向け申請はありません。
      </p>
    `;

    return;

  }


  forms.forEach(form => {

    const card =
      document.createElement('div');

    card.className =
      'border rounded-xl p-6 mb-6';


    let fieldsHtml = '';


    form.fields.forEach((field, index) => {

      const fieldName =
        field.name ||
        'field_' + index;

      const label =
        field.label ||
        fieldName;

      const type =
        field.type ||
        'text';


      if (type === 'textarea') {

        fieldsHtml += `

          <div class="mb-4">

            <label class="block font-bold mb-2">

              ${escapeHtml(label)}

            </label>

            <textarea

              data-form="${form.form_id}"

              data-field="${escapeHtml(fieldName)}"

              rows="4"

              class="form-field w-full border rounded-lg px-4 py-3"

            ></textarea>

          </div>

        `;

      } else {

        fieldsHtml += `

          <div class="mb-4">

            <label class="block font-bold mb-2">

              ${escapeHtml(label)}

            </label>

            <input

              type="${escapeHtml(type)}"

              data-form="${form.form_id}"

              data-field="${escapeHtml(fieldName)}"

              class="form-field w-full border rounded-lg px-4 py-3"

            >

          </div>

        `;

      }

    });


    card.innerHTML = `

      <h3 class="text-xl font-bold mb-2">

        ${escapeHtml(form.title)}

      </h3>


      <p class="text-red-600 mb-5">

        締切：${escapeHtml(form.deadline)}

      </p>


      ${fieldsHtml}


      <div class="mb-4">

        <label class="block font-bold mb-2">

          添付ファイル

        </label>


        <input

          type="file"

          id="file_${form.form_id}"

          class="w-full border rounded-lg px-4 py-3">

      </div>


      <button

        onclick="submitApplication('${form.form_id}')"

        class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">

        申請を提出する

      </button>

    `;


    area.appendChild(card);

  });

}


/* =========================================
   申請
========================================= */

async function submitApplication(formId) {

  const data = {};


  document
    .querySelectorAll(
      `.form-field[data-form="${formId}"]`
    )
    .forEach(input => {

      data[input.dataset.field] =
        input.value;

    });


  const fileInput =
    document.getElementById(
      'file_' + formId
    );


  let file = null;


  if (
    fileInput &&
    fileInput.files.length
  ) {

    const selected =
      fileInput.files[0];


    if (
      selected.size >
      10 * 1024 * 1024
    ) {

      alert(
        'ファイルは10MB以下にしてください。'
      );

      return;

    }


    file =
      await fileToBase64(selected);

  }


  const result = await api({

    action: 'submitForm',

    form_id: formId,

    target_id:
      user.user_id,

    submitter_name:
      user.user_name,

    data: data,

    file: file

  });


  if (!result.success) {

    alert(result.message);
    return;

  }


  alert(result.message);

  await loadSubmissions();

}


/* =========================================
   履歴
========================================= */

async function loadSubmissions() {

  const result = await api({

    action: 'getSubmissionsForTarget',

    target_id:
      user.user_id

  });


  if (!result.success) return;


  submissions =
    result.submissions;


  renderHistory();

}


function renderHistory() {

  const area =
    document.getElementById('historyArea');

  area.innerHTML = '';


  if (!submissions.length) {

    area.innerHTML = `
      <p class="text-gray-500">
        提出履歴はありません。
      </p>
    `;

    return;

  }


  submissions
    .slice()
    .reverse()
    .forEach(sub => {

      const form =
        forms.find(
          f => f.form_id === sub.form_id
        );


      const title =
        form
          ? form.title
          : sub.form_id;


      const card =
        document.createElement('div');

      card.className =
        'border rounded-xl p-5 mb-4';


      card.innerHTML = `

        <div class="flex justify-between gap-4">

          <div>

            <h3 class="font-bold text-lg">

              ${escapeHtml(title)}

            </h3>

            <p class="text-sm text-gray-500">

              ${escapeHtml(String(sub.submitted_at))}

            </p>

          </div>


          <span class="px-3 py-1 rounded-full bg-gray-100">

            ${escapeHtml(sub.status)}

          </span>

        </div>


        ${
          sub.comment
          ? `

            <div class="mt-4 bg-red-50 p-4 rounded-lg">

              <strong class="text-red-700">

                差戻し理由

              </strong>

              <p class="mt-1">

                ${escapeHtml(sub.comment)}

              </p>

            </div>

          `
          : ''
        }


        <div class="flex flex-wrap gap-2 mt-4">

          ${
            sub.generated_pdf_url
            ? `

              <a

                href="${escapeHtml(sub.generated_pdf_url)}"

                target="_blank"

                class="bg-blue-600 text-white px-4 py-2 rounded-lg">

                📄 申請書PDFをダウンロード（教員署名用）

              </a>

            `
            : ''
          }


          ${
            sub.file_url
            ? `

              <a

                href="${escapeHtml(sub.file_url)}"

                target="_blank"

                class="bg-gray-700 text-white px-4 py-2 rounded-lg">

                📎 添付ファイル

              </a>

            `
            : ''
          }

        </div>

      `;


      area.appendChild(card);

    });

}


/* =========================================
   Base64
========================================= */

function fileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();


    reader.onload = () => {

      resolve({

        name:
          file.name,

        mimeType:
          file.type,

        size:
          file.size,

        base64:
          reader.result.split(',')[1]

      });

    };


    reader.onerror =
      reject;


    reader.readAsDataURL(file);

  });

}


/* =========================================
   ログアウト
========================================= */

function logout() {

  sessionStorage.removeItem(
    'festivalUser'
  );

  location.reload();

}


/* =========================================
   Escape
========================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================
   起動
========================================= */

window.addEventListener(
  'DOMContentLoaded',
  async () => {

    const saved =
      sessionStorage.getItem(
        'festivalUser'
      );


    if (!saved) return;


    try {

      user =
        JSON.parse(saved);

      showDashboard();

      await loadForms();

      await loadSubmissions();

    } catch (e) {

      sessionStorage.removeItem(
        'festivalUser'
      );

    }

  }
);

</script>

</body>
</html>
